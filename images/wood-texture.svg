<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620">
  <!-- 極淡的紙張／木紋顆粒，疊在底色上當質感用。刻意做得很淡，重複排列時看不出接縫。 -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="620" height="620" fill="#8A6A42" filter="url(#grain2)"/>
  <rect width="620" height="620" fill="#6B4E2E" filter="url(#grain)"/>
</svg>
